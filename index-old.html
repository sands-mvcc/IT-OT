        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: #2d5016;
        }

        .stat-label {
            font-size: 0.9rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .file-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .file-item {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .file-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(74, 124, 40, 0.1), transparent);
            transition: left 0.5s ease;
        }

        .file-item:hover::before {
            left: 100%;
        }

        .file-item:hover {
            border-color: green;
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
        }

            font-size: 2.5rem;
            margin-bottom: 15px;
            color: #4a7c28;
        }

            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 10px;
            color: #2d5016;
        }

        .file-description {
            color: #666;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .file-meta {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            font-size: 0.8rem;
            color: #999;
        }

        .category-filter {
            margin-bottom: 20px;
        }

        .filter-btn {
            background: white;
            border: 2px solid #4a7c28;
            color: #4a7c28;
            padding: 8px 16px;
            margin: 5px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: #4a7c28;
            color: white;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #4a7c28;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;

        class RepositoryPortal {
            constructor() {
                this.data = repositoryData;
                this.filteredData = this.data;
                this.currentCategory = 'all';
                this.searchTerm = '';
                this.init();
            }

            init() {
                this.setupEventListeners();
                this.updateStats();
                setTimeout(() => this.renderFiles(), 1000); // Simulate loading
            }

            setupEventListeners() {
                // Search functionality
                document.getElementById('searchBox').addEventListener('input', (e) => {
                    this.searchTerm = e.target.value.toLowerCase();
                    this.filterAndRender();
                });

                // Category filters
                document.querySelectorAll('.filter-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                        e.target.classList.add('active');
                        this.currentCategory = e.target.dataset.category;
                        this.filterAndRender();
                    });
                });
            }

            updateStats() {
                const files = this.data.filter(item => item.type === 'file').length;
                const folders = this.data.filter(item => item.type === 'folder').length;
                
                document.getElementById('totalFiles').textContent = files;
                document.getElementById('totalFolders').textContent = folders;
                document.getElementById('lastUpdated').textContent = 'Today';
            }

            filterAndRender() {
                this.filteredData = this.data.filter(item => {
                    const matchesCategory = this.currentCategory === 'all' || item.category === this.currentCategory;
                    const matchesSearch = this.searchTerm === '' || 
                        item.name.toLowerCase().includes(this.searchTerm) ||
                        item.description.toLowerCase().includes(this.searchTerm);
                    
                    return matchesCategory && matchesSearch;
                });

                this.renderFiles();
            }

            renderFiles() {
                const loadingState = document.getElementById('loadingState');
                const fileGrid = document.getElementById('fileGrid');
                const noResults = document.getElementById('noResults');

                loadingState.style.display = 'none';

                if (this.filteredData.length === 0) {
                    fileGrid.style.display = 'none';
                    noResults.style.display = 'block';
                    return;
                }

                noResults.style.display = 'none';
                fileGrid.style.display = 'grid';

                fileGrid.innerHTML = this.filteredData.map(item => `
                    <div class="file-item" onclick="window.open('${item.url}', '_blank')">
                        <div class="file-icon">${item.icon}</div>
                        <div class="file-name">${item.name}</div>
                        <div class="file-description">${item.description}</div>
                        <div class="file-meta">
                            <span>${item.size}</span>
                            <span>${item.modified}</span>
                        </div>
                    </div>
                `).join('');

                // Add staggered animation
                document.querySelectorAll('.file-item').forEach((item, index) => {
                    item.style.opacity = '0';
                    item.style.transform = 'translateY(20px)';
                    setTimeout(() => {
                        item.style.transition = 'all 0.5s ease';
                        item.style.opacity = '1';
                        item.style.transform = 'translateY(0)';
                    }, index * 100);
                });
            }
        }

        // Initialize the portal when the page loads
        document.addEventListener('DOMContentLoaded', () => {
            new RepositoryPortal();
        });

        // Add some interactive features
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'k') {
                e.preventDefault();
                document.getElementById('searchBox').focus();
            }
        });
    </script>
</body>
</html>
